<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅の記録">
  <meta name="robots" content="noindex">
  <title>旅の記録</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="地図"></div>

  <header class="brand">
    <p class="brand-kicker">Travel Log</p>
    <h1 class="brand-title">旅の記録</h1>
    <p class="brand-stats" id="stats"></p>
  </header>

  <button class="settings-btn" id="settings-btn" type="button" aria-label="設定">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>

  <section class="sheet" id="sheet">
    <button class="grabber" id="grabber" type="button" aria-label="一覧を広げる"><span></span></button>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="overlay" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <form id="form" novalidate></form>
    </div>
  </div>

  <div class="overlay overlay-confirm" id="confirm" hidden>
    <div class="confirm-card" role="alertdialog" aria-modal="true">
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-ghost" id="confirm-no">やめる</button>
        <button type="button" class="btn btn-danger" id="confirm-yes">削除する</button>
      </div>
    </div>
  </div>

  <div class="picker" id="picker" hidden>
    <div class="picker-cross" aria-hidden="true"></div>
    <div class="picker-bar">
      <p>地図を動かして、中心を場所に合わせてください</p>
      <div class="picker-actions">
        <button type="button" class="btn btn-ghost" id="picker-cancel">やめる</button>
        <button type="button" class="btn btn-primary" id="picker-ok">この位置にする</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
